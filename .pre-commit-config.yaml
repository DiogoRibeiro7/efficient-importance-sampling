repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check tests src/efficient_importance_sampling/__init__.py src/efficient_importance_sampling/__main__.py
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: mypy
        name: Mypy
        entry: mypy tests
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest
        name: Pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
