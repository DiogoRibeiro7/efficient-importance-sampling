[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-importance-sampling"
version = "0.1.0"
description = "Rare-event simulation with computationally efficient importance-sampling mixtures."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
  { name = "Diogo Ribeiro" },
]
keywords = [
  "importance-sampling",
  "monte-carlo",
  "rare-events",
  "sequential-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/efficient-importance-sampling"
Repository = "https://github.com/DiogoRibeiro7/efficient-importance-sampling"
Issues = "https://github.com/DiogoRibeiro7/efficient-importance-sampling/issues"

[tool.setuptools]
py-modules = ["efficient_importance_sampling"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["efficient_importance_sampling"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
ignore = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "efficient_importance_sampling"
ignore_errors = true
