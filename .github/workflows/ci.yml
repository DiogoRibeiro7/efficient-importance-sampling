name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check new-code formatting
        run: ruff format --check tests src/efficient_importance_sampling/__init__.py src/efficient_importance_sampling/__main__.py

      - name: Type-check tests
        run: mypy tests

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/security-scan.yml@7c8ac767685d40f3f4e80846842d6e9ad645b323 # v1.2.0
    with:
      paths: src/efficient_importance_sampling
      dependency-install-command: python -m pip install -e ".[dev]"
      pip-version: latest
      bandit-args: "-q"
      skip-trivy: true
      skip-npm-signatures: true
      skip-java-verify: true
      skip-go-verify: true
